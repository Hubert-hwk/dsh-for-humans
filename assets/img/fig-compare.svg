<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1f2430" flood-opacity="0.14"/>
    </filter>
    <marker id="cmpArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4bd6"/>
    </marker>
    <linearGradient id="cmpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bd6"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">整车 vs 造车平台：Claude Code / Codex 与 DeepSeek Harness</text>

  <!-- 左：两台整车 -->
  <g filter="url(#shadow)">
    <rect x="30" y="56" width="380" height="250" rx="18" fill="#ffffff" stroke="#c6cddd"/>
    <text x="220" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">🚗 整车：agent 产品</text>

    <rect x="52" y="104" width="160" height="118" rx="14" fill="#f6f7fb" stroke="#e0e4ee"/>
    <text x="132" y="136" text-anchor="middle" font-size="34">🚗</text>
    <text x="132" y="164" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2430">Claude Code</text>
    <text x="132" y="186" text-anchor="middle" font-size="11.5" fill="#7a8296">终端编程 agent</text>
    <text x="132" y="206" text-anchor="middle" font-size="11.5" fill="#7a8296">Anthropic 出品 · 闭源</text>

    <rect x="228" y="104" width="160" height="118" rx="14" fill="#f6f7fb" stroke="#e0e4ee"/>
    <text x="308" y="136" text-anchor="middle" font-size="34">🚙</text>
    <text x="308" y="164" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2430">Codex</text>
    <text x="308" y="186" text-anchor="middle" font-size="11.5" fill="#7a8296">编程 agent</text>
    <text x="308" y="206" text-anchor="middle" font-size="11.5" fill="#7a8296">OpenAI 出品 · 闭源</text>

    <text x="220" y="250" text-anchor="middle" font-size="12.5" fill="#4a5266">开箱即用：模型 + 工具 + 流程都焊死了</text>
    <text x="220" y="272" text-anchor="middle" font-size="12.5" fill="#7a8296">适合「赶紧把代码库里的活干完」</text>
  </g>

  <!-- 右：dsh 平台 -->
  <g filter="url(#shadow)">
    <rect x="450" y="56" width="380" height="250" rx="18" fill="url(#cmpGrad)"/>
    <text x="640" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">🏗️ 造车平台：agent 框架</text>

    <g font-size="12" fill="#1c2c8a">
      <rect x="474" y="104" width="104" height="34" rx="9" fill="#ffffff"/><text x="526" y="126" text-anchor="middle" font-weight="600">插件树</text>
      <rect x="588" y="104" width="104" height="34" rx="9" fill="#ffffff"/><text x="640" y="126" text-anchor="middle" font-weight="600">能力缝</text>
      <rect x="702" y="104" width="104" height="34" rx="9" fill="#ffffff"/><text x="754" y="126" text-anchor="middle" font-weight="600">作用域</text>
      <rect x="474" y="148" width="104" height="34" rx="9" fill="#ffffff"/><text x="526" y="170" text-anchor="middle" font-weight="600">会话日志</text>
      <rect x="588" y="148" width="104" height="34" rx="9" fill="#ffffff"/><text x="640" y="170" text-anchor="middle" font-weight="600">工具流水线</text>
      <rect x="702" y="148" width="104" height="34" rx="9" fill="#ffffff"/><text x="754" y="170" text-anchor="middle" font-weight="600">子代理</text>
    </g>

    <text x="640" y="212" text-anchor="middle" font-size="12.5" fill="#e6e9ff">模型、工具、界面、流程 —— 全部可换</text>
    <g font-size="12" fill="#ffffff">
      <rect x="478" y="226" width="76" height="30" rx="8" fill="rgba(255,255,255,0.18)"/><text x="516" y="245" text-anchor="middle">🖥️ Web UI</text>
      <rect x="562" y="226" width="82" height="30" rx="8" fill="rgba(255,255,255,0.18)"/><text x="603" y="245" text-anchor="middle">⌨️ headless</text>
      <rect x="652" y="226" width="76" height="30" rx="8" fill="rgba(255,255,255,0.18)"/><text x="690" y="245" text-anchor="middle">📦 SDK</text>
      <rect x="736" y="226" width="72" height="30" rx="8" fill="rgba(255,255,255,0.18)"/><text x="772" y="245" text-anchor="middle">🤖 ACP</text>
    </g>
    <text x="640" y="284" text-anchor="middle" font-size="11.5" fill="#c9d4ff">MIT 开源 · 可嵌入你的产品 · 可无人值守</text>
  </g>

  <!-- 中间箭头 -->
  <line x1="412" y1="180" x2="448" y2="180" stroke="#2f4bd6" stroke-width="3" marker-end="url(#cmpArr)"/>
  <text x="430" y="165" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2f4bd6">vs</text>

  <!-- 底部：雇佣关系 -->
  <g filter="url(#shadow)">
    <rect x="30" y="330" width="800" height="118" rx="18" fill="#fdf0e6" stroke="#f5c6a0"/>
    <text x="430" y="360" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e8590c">🤝 独门绝活：把整车雇成「员工」</text>
    <text x="430" y="386" text-anchor="middle" font-size="12.5" fill="#4a5266">dsh 的 ctx.subagents 能力缝提供进程外传输：你的主 agent 可以把任务</text>
    <text x="430" y="408" text-anchor="middle" font-size="12.5" fill="#4a5266">委派给真正的 Claude Code / Codex 进程执行，再把结果收回来。</text>
    <g font-size="12.5" fill="#1c2c8a">
      <rect x="196" y="420" width="120" height="22" rx="11" fill="#ffffff" stroke="#e8b796"/><text x="256" y="435" text-anchor="middle">🎯 主 agent</text>
      <rect x="376" y="420" width="108" height="22" rx="11" fill="#ffffff" stroke="#e8b796"/><text x="430" y="435" text-anchor="middle">🧑‍💼 子代理</text>
      <rect x="544" y="420" width="120" height="22" rx="11" fill="#ffffff" stroke="#e8b796"/><text x="604" y="435" text-anchor="middle">🚗 Claude Code / Codex</text>
    </g>
  </g>
</svg>
