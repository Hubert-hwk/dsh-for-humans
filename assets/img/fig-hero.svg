<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f2430" flood-opacity="0.15"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2f4bd6" flood-opacity="0.35"/>
    </filter>
    <marker id="hArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4bd6"/>
    </marker>
    <marker id="hArrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <linearGradient id="hGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bd6"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">给 AI 装上的「驾驶舱 + 手脚 + 办公室」</text>

  <!-- 用户 -->
  <g filter="url(#sh1)">
    <rect x="30" y="104" width="150" height="128" rx="16" fill="#ffffff" stroke="#c6cddd"/>
    <circle cx="105" cy="140" r="19" fill="#eef1ff" stroke="#2f4bd6"/>
    <path d="M86,190 a19,19 0 0 1 38,0 z" fill="#eef1ff" stroke="#2f4bd6"/>
    <text x="105" y="258" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">你 · 驾驶员</text>
    <text x="105" y="278" text-anchor="middle" font-size="11.5" fill="#7a8296">浏览器 / 终端 / SDK</text>
  </g>

  <!-- 模型 -->
  <g filter="url(#sh1)">
    <rect x="30" y="312" width="150" height="120" rx="16" fill="#fdf0e6" stroke="#f5c6a0"/>
    <text x="105" y="352" text-anchor="middle" font-size="30">🧠</text>
    <text x="105" y="382" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2430">大模型大脑</text>
    <text x="105" y="404" text-anchor="middle" font-size="11.5" fill="#7a8296">只负责「想」</text>
  </g>

  <!-- 驾驶舱 -->
  <g filter="url(#sh2)">
    <rect x="232" y="86" width="356" height="296" rx="20" fill="url(#hGrad)"/>
    <text x="410" y="118" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">🛞 DeepSeek Harness 驾驶舱</text>
    <text x="410" y="142" text-anchor="middle" font-size="12" fill="#d5ddff">万物皆插件 · 一棵由 Cordis 组装的插件树</text>

    <!-- 仪表盘插件格子 -->
    <g font-size="12.5" font-weight="700" fill="#1c2c8a">
      <rect x="256" y="162" width="100" height="44" rx="10" fill="#ffffff"/><text x="306" y="180" text-anchor="middle">agent-loop</text><text x="306" y="197" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">循环引擎</text>
      <rect x="364" y="162" width="100" height="44" rx="10" fill="#ffffff"/><text x="414" y="180" text-anchor="middle">tools</text><text x="414" y="197" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">工具架</text>
      <rect x="472" y="162" width="92" height="44" rx="10" fill="#ffffff"/><text x="518" y="180" text-anchor="middle">session</text><text x="518" y="197" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">飞行记录</text>
      <rect x="256" y="216" width="100" height="44" rx="10" fill="#ffffff"/><text x="306" y="234" text-anchor="middle">llm 适配器</text><text x="306" y="251" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">发动机</text>
      <rect x="364" y="216" width="100" height="44" rx="10" fill="#ffffff"/><text x="414" y="234" text-anchor="middle">skill</text><text x="414" y="251" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">操作手册</text>
      <rect x="472" y="216" width="92" height="44" rx="10" fill="#ffffff"/><text x="518" y="234" text-anchor="middle">subagent</text><text x="518" y="251" text-anchor="middle" font-size="10.5" font-weight="500" fill="#7a8296">外派员工</text>
    </g>
    <text x="410" y="296" text-anchor="middle" font-size="11.5" fill="#c9d4ff">……还有 60+ 个插件，全部可以替换、叠加、拆除</text>

    <!-- 仪表装饰 -->
    <circle cx="292" cy="344" r="22" fill="rgba(255,255,255,0.14)"/>
    <path d="M292,344 L302,330" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="292" y="380" text-anchor="middle" font-size="10.5" fill="#d5ddff">思考中…</text>
    <circle cx="528" cy="344" r="22" fill="rgba(255,255,255,0.14)"/>
    <path d="M528,344 L518,330" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="528" y="380" text-anchor="middle" font-size="10.5" fill="#d5ddff">工具调用</text>
  </g>

  <!-- 环境 -->
  <g filter="url(#sh1)">
    <rect x="650" y="86" width="180" height="296" rx="18" fill="#ffffff" stroke="#c6cddd"/>
    <text x="740" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">环境 · 手脚+办公室</text>
    <g font-size="12.5" fill="#4a5266">
      <rect x="672" y="136" width="136" height="38" rx="10" fill="#eef1ff" stroke="#c9d4ff"/><text x="740" y="159" text-anchor="middle">📁 文件系统</text>
      <rect x="672" y="184" width="136" height="38" rx="10" fill="#eef1ff" stroke="#c9d4ff"/><text x="740" y="207" text-anchor="middle">💻 Shell / 终端</text>
      <rect x="672" y="232" width="136" height="38" rx="10" fill="#eef1ff" stroke="#c9d4ff"/><text x="740" y="255" text-anchor="middle">🌐 网页搜索</text>
      <rect x="672" y="280" width="136" height="38" rx="10" fill="#eef1ff" stroke="#c9d4ff"/><text x="740" y="303" text-anchor="middle">🛡️ 沙箱 / 审批</text>
      <rect x="672" y="328" width="136" height="38" rx="10" fill="#eef1ff" stroke="#c9d4ff"/><text x="740" y="351" text-anchor="middle">🤝 子代理 / 工作流</text>
    </g>
  </g>

  <!-- 箭头 -->
  <g>
    <line x1="182" y1="168" x2="230" y2="178" stroke="#2f4bd6" stroke-width="2.5" marker-end="url(#hArr)"/>
    <line x1="230" y1="212" x2="182" y2="202" stroke="#2f4bd6" stroke-width="2.5" marker-end="url(#hArr)"/>
    <text x="204" y="156" text-anchor="middle" font-size="11.5" fill="#2f4bd6">指令</text>
    <text x="204" y="234" text-anchor="middle" font-size="11.5" fill="#2f4bd6">进度</text>

    <line x1="182" y1="372" x2="230" y2="326" stroke="#e8590c" stroke-width="2.5" marker-end="url(#hArrO)"/>
    <line x1="230" y1="280" x2="182" y2="330" stroke="#e8590c" stroke-width="2.5" marker-end="url(#hArrO)"/>
    <text x="202" y="352" text-anchor="middle" font-size="11.5" fill="#e8590c">请求/流式回复</text>

    <line x1="590" y1="220" x2="648" y2="220" stroke="#2f4bd6" stroke-width="2.5" marker-end="url(#hArr)"/>
    <line x1="648" y1="252" x2="590" y2="252" stroke="#2f4bd6" stroke-width="2.5" marker-end="url(#hArr)"/>
    <text x="619" y="208" text-anchor="middle" font-size="11.5" fill="#2f4bd6">调用能力</text>
    <text x="619" y="272" text-anchor="middle" font-size="11.5" fill="#2f4bd6">观察反馈</text>
  </g>

  <text x="430" y="438" text-anchor="middle" font-size="13" fill="#7a8296">关键：模型只负责「想」，dsh 负责「想清楚之后怎么动手、动了手怎么记录」。</text>
</svg>
