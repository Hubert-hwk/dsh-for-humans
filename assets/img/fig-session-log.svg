<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="sShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2430" flood-opacity="0.13"/>
    </filter>
    <marker id="sArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4bd6"/>
    </marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">📒 流水账 vs 余额：日志是账本，模型历史是随时可重算的余额</text>

  <!-- 左：流水账 -->
  <g filter="url(#sShadow)">
    <rect x="30" y="56" width="300" height="306" rx="16" fill="#ffffff" stroke="#c6cddd"/>
    <text x="180" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">📒 会话日志（流水账）</text>
    <text x="180" y="106" text-anchor="middle" font-size="11.5" fill="#7a8296">只追加 · 序号连续 · 不可删改</text>
    <g font-size="12.5" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#dce4f3">
      <rect x="52" y="122" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="142" fill="#ffd479">1</text><text x="96" y="142" fill="#a5e3a5">turn/start</text>
      <rect x="52" y="160" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="180" fill="#ffd479">2</text><text x="96" y="180" fill="#a5e3a5">user/message</text>
      <rect x="52" y="198" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="218" fill="#ffd479">3</text><text x="96" y="218" fill="#ff9ec7">assistant/message</text>
      <rect x="52" y="236" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="256" fill="#ffd479">4</text><text x="96" y="256" fill="#ff9ec7">tool/call · result</text>
      <rect x="52" y="274" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="294" fill="#ffd479">5</text><text x="96" y="294" fill="#ff9ec7">assistant/message</text>
      <rect x="52" y="312" width="256" height="30" rx="7" fill="#232a3b"/><text x="66" y="332" fill="#ffd479">6</text><text x="96" y="332" fill="#ffd479">turn/end</text>
    </g>
  </g>

  <!-- 投影 -->
  <g>
    <line x1="332" y1="208" x2="392" y2="208" stroke="#2f4bd6" stroke-width="3" marker-end="url(#sArr)"/>
    <text x="362" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2f4bd6">🧮 投影</text>
    <text x="362" y="228" text-anchor="middle" font-size="11" fill="#7a8296">deriveMessages()</text>
  </g>

  <!-- 右：余额 -->
  <g filter="url(#sShadow)">
    <rect x="400" y="56" width="240" height="306" rx="16" fill="#ffffff" stroke="#c6cddd"/>
    <text x="520" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">💰 模型看到的历史</text>
    <text x="520" y="106" text-anchor="middle" font-size="11.5" fill="#7a8296">每次请求前重算，不单独存储</text>
    <g font-size="12">
      <rect x="422" y="122" width="196" height="32" rx="8" fill="#eef1ff" stroke="#c9d4ff"/><text x="436" y="143" fill="#1c2c8a">user：帮我看看这个仓库</text>
      <rect x="422" y="162" width="196" height="32" rx="8" fill="#fdf0e6" stroke="#f5c6a0"/><text x="436" y="183" fill="#c2410c">assistant：先读文件…</text>
      <rect x="422" y="202" width="196" height="32" rx="8" fill="#e9f7ef" stroke="#a8d8bd"/><text x="436" y="223" fill="#14532d">tool result：文件内容…</text>
      <rect x="422" y="242" width="196" height="32" rx="8" fill="#fdf0e6" stroke="#f5c6a0"/><text x="436" y="263" fill="#c2410c">assistant：结论是…</text>
    </g>
    <text x="520" y="340" text-anchor="middle" font-size="11.5" fill="#7a8296">压缩 = 划掉旧行，不撕账本</text>
  </g>

  <!-- 落盘 -->
  <g filter="url(#sShadow)">
    <rect x="676" y="56" width="154" height="306" rx="16" fill="#f6f7fb" stroke="#c6cddd" stroke-dasharray="6 4"/>
    <text x="753" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">💾 落盘</text>
    <rect x="692" y="104" width="122" height="70" rx="10" fill="#ffffff" stroke="#c6cddd"/>
    <text x="753" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2430">JSONL</text>
    <text x="753" y="152" text-anchor="middle" font-size="10.5" fill="#7a8296">每会话一个日志文件</text>
    <rect x="692" y="186" width="122" height="70" rx="10" fill="#ffffff" stroke="#c6cddd"/>
    <text x="753" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2430">SQLite</text>
    <text x="753" y="234" text-anchor="middle" font-size="10.5" fill="#7a8296">每事件一行，一个库</text>
    <rect x="692" y="268" width="122" height="70" rx="10" fill="#e9f7ef" stroke="#a8d8bd"/>
    <text x="753" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">崩溃恢复</text>
    <text x="753" y="316" text-anchor="middle" font-size="10.5" fill="#4a5266">补「此轮中断」不撕账</text>
  </g>

  <text x="430" y="408" text-anchor="middle" font-size="13" fill="#7a8296">因为账本（日志）完整，所以余额（历史）、报表（标题/遥测）、副本（fork/恢复）都能随时重建。</text>
</svg>
