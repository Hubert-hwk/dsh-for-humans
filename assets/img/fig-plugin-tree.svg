<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f2430" flood-opacity="0.14"/>
    </filter>
    <marker id="pArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4bd6"/>
    </marker>
    <linearGradient id="pGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bd6"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">🧱 乐高积木：profile + 组合包 + patch 拼出一棵插件树</text>

  <!-- 左：拼装指南 -->
  <g filter="url(#pShadow)">
    <rect x="30" y="66" width="220" height="336" rx="18" fill="#ffffff" stroke="#c6cddd"/>
    <rect x="30" y="66" width="220" height="46" rx="18" fill="#2f4bd6"/>
    <rect x="30" y="92" width="220" height="20" fill="#2f4bd6"/>
    <text x="140" y="96" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">📋 profile 套餐蓝图</text>
    <text x="140" y="136" text-anchor="middle" font-size="11.5" fill="#7a8296">web / headless / 自定义</text>

    <g font-size="12" fill="#4a5266">
      <rect x="52" y="154" width="176" height="34" rx="9" fill="#eef1ff" stroke="#c9d4ff"/><text x="140" y="176" text-anchor="middle">① dsh-base 组合包</text>
      <rect x="52" y="196" width="176" height="34" rx="9" fill="#eef1ff" stroke="#c9d4ff"/><text x="140" y="218" text-anchor="middle">② web-app / headless</text>
      <rect x="52" y="238" width="176" height="34" rx="9" fill="#fdf0e6" stroke="#f5c6a0"/><text x="140" y="260" text-anchor="middle">③ 你的 cordis.patch.yml</text>
      <rect x="52" y="280" width="176" height="34" rx="9" fill="#fdf0e6" stroke="#f5c6a0"/><text x="140" y="302" text-anchor="middle">④ home 级 patch</text>
      <rect x="52" y="322" width="176" height="34" rx="9" fill="#fdf0e6" stroke="#f5c6a0"/><text x="140" y="344" text-anchor="middle">⑤ --patch overlay</text>
    </g>
    <text x="140" y="384" text-anchor="middle" font-size="11.5" fill="#7a8296">后贴的贴纸盖先贴的</text>
  </g>

  <line x1="252" y1="234" x2="330" y2="234" stroke="#2f4bd6" stroke-width="3" marker-end="url(#pArr)"/>
  <text x="291" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#2f4bd6">拼装</text>

  <!-- 右：插件树（乐高块带凸点） -->
  <g filter="url(#pShadow)">
    <rect x="342" y="66" width="488" height="336" rx="18" fill="#ffffff" stroke="#c6cddd"/>
    <text x="586" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2430">🌳 一棵活着的插件树（ctx）</text>

    <g>
      <rect x="366" y="112" width="216" height="44" rx="10" fill="url(#pGrad)"/>
      <circle cx="386" cy="122" r="4" fill="#ffffff" opacity="0.8"/><circle cx="404" cy="122" r="4" fill="#ffffff" opacity="0.8"/><circle cx="422" cy="122" r="4" fill="#ffffff" opacity="0.8"/><circle cx="440" cy="122" r="4" fill="#ffffff" opacity="0.8"/>
      <text x="474" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">llm-deepseek · 发动机</text>
      <rect x="590" y="112" width="216" height="44" rx="10" fill="#7c5cff"/>
      <circle cx="610" cy="122" r="4" fill="#ffffff" opacity="0.8"/><circle cx="628" cy="122" r="4" fill="#ffffff" opacity="0.8"/><circle cx="646" cy="122" r="4" fill="#ffffff" opacity="0.8"/>
      <text x="698" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">tools · 工具架</text>

      <rect x="366" y="166" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <circle cx="386" cy="176" r="4" fill="#2f4bd6" opacity="0.5"/><circle cx="404" cy="176" r="4" fill="#2f4bd6" opacity="0.5"/>
      <text x="474" y="192" text-anchor="middle" font-size="12.5" fill="#1c2c8a">session · 飞行记录</text>
      <rect x="590" y="166" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <circle cx="610" cy="176" r="4" fill="#2f4bd6" opacity="0.5"/><circle cx="628" cy="176" r="4" fill="#2f4bd6" opacity="0.5"/>
      <text x="698" y="192" text-anchor="middle" font-size="12.5" fill="#1c2c8a">system-prompt · 提示词组装</text>

      <rect x="366" y="216" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <circle cx="386" cy="226" r="4" fill="#2f4bd6" opacity="0.5"/><circle cx="404" cy="226" r="4" fill="#2f4bd6" opacity="0.5"/>
      <text x="474" y="242" text-anchor="middle" font-size="12.5" fill="#1c2c8a">agent-loop · 循环引擎</text>
      <rect x="590" y="216" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <circle cx="610" cy="226" r="4" fill="#2f4bd6" opacity="0.5"/><circle cx="628" cy="226" r="4" fill="#2f4bd6" opacity="0.5"/>
      <text x="698" y="242" text-anchor="middle" font-size="12.5" fill="#1c2c8a">persistence · 落盘</text>

      <rect x="366" y="266" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <text x="474" y="292" text-anchor="middle" font-size="12.5" fill="#1c2c8a">sandbox · 沙箱</text>
      <rect x="590" y="266" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <text x="698" y="292" text-anchor="middle" font-size="12.5" fill="#1c2c8a">tool-bash · tool-fs · web</text>

      <rect x="366" y="316" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <text x="474" y="342" text-anchor="middle" font-size="12.5" fill="#1c2c8a">approval · 审批</text>
      <rect x="590" y="316" width="216" height="40" rx="10" fill="#eef1ff" stroke="#c9d4ff"/>
      <text x="698" y="342" text-anchor="middle" font-size="12.5" fill="#1c2c8a">subagent · workflow · skill</text>

      <rect x="366" y="366" width="216" height="28" rx="8" fill="#fdf0e6" stroke="#f5c6a0"/>
      <text x="474" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#c2410c">➕ 你的插件（新积木）</text>
      <rect x="590" y="366" width="216" height="28" rx="8" fill="#e9f7ef" stroke="#a8d8bd"/>
      <text x="698" y="385" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">🧩 随时插入 · 随时拆除</text>
    </g>
  </g>

  <text x="430" y="438" text-anchor="middle" font-size="13" fill="#7a8296">没有「特权内核」：连 agent-loop 本身都是积木 —— 任何一块都能被你的积木替换或修改。</text>
</svg>
