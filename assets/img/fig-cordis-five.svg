<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2430" flood-opacity="0.13"/>
    </filter>
    <marker id="cArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8296"/>
    </marker>
    <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4bd6"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">🔩 Cordis 五件事：积木之间怎么咬合</text>

  <!-- 中心：插件 -->
  <g filter="url(#cShadow)">
    <rect x="330" y="168" width="200" height="112" rx="18" fill="url(#cGrad)"/>
    <text x="430" y="210" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">🧩 插件</text>
    <text x="430" y="236" text-anchor="middle" font-size="12" fill="#e6e9ff">一段挂载代码</text>
    <text x="430" y="256" text-anchor="middle" font-size="12" fill="#e6e9ff">工具 · 适配器 · 策略 · 界面</text>
  </g>

  <!-- ① 上下文 -->
  <g filter="url(#cShadow)">
    <rect x="320" y="46" width="220" height="74" rx="14" fill="#ffffff" stroke="#c6cddd"/>
    <text x="430" y="72" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f4bd6">① 上下文 ctx</text>
    <text x="430" y="96" text-anchor="middle" font-size="11.5" fill="#4a5266">服务的容器 · 按 key 查找</text>
    <line x1="430" y1="120" x2="430" y2="166" stroke="#7a8296" stroke-width="2" marker-end="url(#cArr)"/>
  </g>

  <!-- ② 注入 -->
  <g filter="url(#cShadow)">
    <rect x="614" y="158" width="216" height="74" rx="14" fill="#ffffff" stroke="#c6cddd"/>
    <text x="722" y="184" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f4bd6">② inject 声明依赖</text>
    <text x="722" y="208" text-anchor="middle" font-size="11.5" fill="#4a5266">要什么服务，等它就绪才启动</text>
    <line x1="612" y1="195" x2="534" y2="195" stroke="#7a8296" stroke-width="2" marker-end="url(#cArr)"/>
  </g>

  <!-- ③ 事件 -->
  <g filter="url(#cShadow)">
    <rect x="320" y="330" width="220" height="88" rx="14" fill="#ffffff" stroke="#c6cddd"/>
    <text x="430" y="356" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f4bd6">③ 类型化事件</text>
    <text x="430" y="378" text-anchor="middle" font-size="11.5" fill="#4a5266">emit 观察 · waterfall 拦截</text>
    <text x="430" y="396" text-anchor="middle" font-size="11.5" fill="#4a5266">parallel 并行 · serial 按序</text>
    <line x1="430" y1="330" x2="430" y2="282" stroke="#7a8296" stroke-width="2" marker-end="url(#cArr)"/>
  </g>

  <!-- ④ 副作用 -->
  <g filter="url(#cShadow)">
    <rect x="30" y="158" width="216" height="74" rx="14" fill="#ffffff" stroke="#c6cddd"/>
    <text x="138" y="184" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2f4bd6">④ 可逆副作用</text>
    <text x="138" y="208" text-anchor="middle" font-size="11.5" fill="#4a5266">ctx.effect() / ctx.on() 注册</text>
    <line x1="248" y1="195" x2="326" y2="195" stroke="#7a8296" stroke-width="2" marker-end="url(#cArr)"/>
  </g>

  <!-- ⑤ 生命周期 -->
  <g filter="url(#cShadow)">
    <rect x="30" y="330" width="216" height="88" rx="14" fill="#fdf0e6" stroke="#f5c6a0"/>
    <text x="138" y="356" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e8590c">⑤ 生命周期</text>
    <text x="138" y="378" text-anchor="middle" font-size="11.5" fill="#4a5266">加载 → 就绪 → 运行 → 卸载</text>
    <text x="138" y="396" text-anchor="middle" font-size="11.5" fill="#7a8296">卸载 = 一切注册随之撤销</text>
  </g>

  <text x="430" y="450" text-anchor="middle" font-size="13" fill="#7a8296">服务靠 key 查找、事件靠类型沟通、副作用靠 disposer 撤销 —— 于是整个产品可以热插拔、可重载。</text>
</svg>
