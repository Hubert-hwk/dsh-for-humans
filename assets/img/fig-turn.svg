<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 570" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <filter id="tShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2430" flood-opacity="0.13"/>
    </filter>
    <marker id="tArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4bd6"/>
    </marker>
    <marker id="tArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a4c"/>
    </marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2430">🚉 一次「轮次」的旅程：用户一句话，到模型动手，全程被记录</text>

  <!-- 左侧：旅程 -->
  <g font-size="13">
    <g filter="url(#tShadow)">
      <rect x="36" y="58" width="304" height="46" rx="12" fill="#ffffff" stroke="#c6cddd"/>
      <text x="188" y="76" text-anchor="middle" font-weight="700" fill="#1f2430">🟢 出发：消息进收件箱</text>
      <text x="188" y="95" text-anchor="middle" font-size="11.5" fill="#7a8296">followup / steer / inject</text>
    </g>
    <line x1="188" y1="104" x2="188" y2="128" stroke="#2f4bd6" stroke-width="2" marker-end="url(#tArr)"/>

    <g filter="url(#tShadow)">
      <rect x="36" y="130" width="304" height="46" rx="12" fill="#eef1ff" stroke="#2f4bd6"/>
      <text x="188" y="148" text-anchor="middle" font-weight="700" fill="#1c2c8a">🚦 认领消息 · agent/pre-step</text>
      <text x="188" y="167" text-anchor="middle" font-size="11.5" fill="#4a5266">门口检查：可改写、可拒绝</text>
    </g>
    <line x1="188" y1="176" x2="188" y2="200" stroke="#2f4bd6" stroke-width="2" marker-end="url(#tArr)"/>

    <g filter="url(#tShadow)">
      <rect x="36" y="202" width="304" height="46" rx="12" fill="#eef1ff" stroke="#2f4bd6"/>
      <text x="188" y="220" text-anchor="middle" font-weight="700" fill="#1c2c8a">🧩 组装提示词 + 工具</text>
      <text x="188" y="239" text-anchor="middle" font-size="11.5" fill="#4a5266">从日志派生历史 · request/header</text>
    </g>
    <line x1="188" y1="248" x2="188" y2="272" stroke="#2f4bd6" stroke-width="2" marker-end="url(#tArr)"/>

    <g filter="url(#tShadow)">
      <rect x="36" y="274" width="304" height="46" rx="12" fill="#fdf0e6" stroke="#e8590c"/>
      <text x="188" y="292" text-anchor="middle" font-weight="700" fill="#c2410c">🧠 请求 LLM · 流式回复</text>
      <text x="188" y="311" text-anchor="middle" font-size="11.5" fill="#7a8296">assistant/chunk 逐片落日志</text>
    </g>
    <line x1="188" y1="320" x2="188" y2="344" stroke="#2f4bd6" stroke-width="2" marker-end="url(#tArr)"/>

    <g filter="url(#tShadow)">
      <rect x="36" y="346" width="304" height="46" rx="12" fill="#eef1ff" stroke="#2f4bd6"/>
      <text x="188" y="364" text-anchor="middle" font-weight="700" fill="#1c2c8a">🛠️ 工具调用（可循环多步）</text>
      <text x="188" y="383" text-anchor="middle" font-size="11.5" fill="#4a5266">pre → execute → post</text>
    </g>
    <line x1="188" y1="392" x2="188" y2="416" stroke="#2f4bd6" stroke-width="2" marker-end="url(#tArr)"/>

    <g filter="url(#tShadow)">
      <rect x="36" y="418" width="304" height="46" rx="12" fill="#ffffff" stroke="#c6cddd"/>
      <text x="188" y="436" text-anchor="middle" font-weight="700" fill="#1f2430">🔁 还欠工作吗？</text>
      <text x="188" y="455" text-anchor="middle" font-size="11.5" fill="#7a8296">有 → 回到第 4 站（下一步骤）</text>
    </g>
    <path d="M 56 441 L 24 441 L 24 296 L 34 296" fill="none" stroke="#2f4bd6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tArr)"/>
    <text x="14" y="372" font-size="11" fill="#2f4bd6" transform="rotate(-90 14 372)">循环：步骤 2、3、4…</text>

    <line x1="188" y1="464" x2="188" y2="488" stroke="#1f8a4c" stroke-width="2" marker-end="url(#tArrG)"/>
    <g filter="url(#tShadow)">
      <rect x="36" y="490" width="304" height="42" rx="12" fill="#e9f7ef" stroke="#1f8a4c"/>
      <text x="188" y="516" text-anchor="middle" font-weight="700" fill="#14532d">🏁 轮次结束（不再欠账）</text>
    </g>
  </g>

  <!-- 右侧：日志（账本/记录仪） -->
  <g filter="url(#tShadow)">
    <rect x="470" y="58" width="350" height="474" rx="16" fill="#232a3b"/>
    <text x="645" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">📒 飞行记录仪（只追加日志）</text>

    <g font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">
      <rect x="496" y="102" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="121" fill="#ffd479">turn/start</text><text x="700" y="121" fill="#8a97b8" text-anchor="end">seq 1</text>
      <rect x="496" y="136" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="155" fill="#a5e3a5">user/message</text><text x="700" y="155" fill="#8a97b8" text-anchor="end">seq 2</text>
      <rect x="496" y="170" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="189" fill="#82c8ff">request/header</text><text x="700" y="189" fill="#8a97b8" text-anchor="end">seq 3</text>
      <rect x="496" y="204" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="223" fill="#ff9ec7">assistant/chunk</text><text x="700" y="223" fill="#8a97b8" text-anchor="end">seq 4…</text>
      <rect x="496" y="238" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="257" fill="#ff9ec7">assistant/message</text><text x="700" y="257" fill="#8a97b8" text-anchor="end">seq n</text>
      <rect x="496" y="272" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="291" fill="#ff9ec7">tool/call</text><text x="700" y="291" fill="#8a97b8" text-anchor="end">seq n+1</text>
      <rect x="496" y="306" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="325" fill="#ff9ec7">tool/result</text><text x="700" y="325" fill="#8a97b8" text-anchor="end">seq n+2</text>
      <rect x="496" y="340" width="298" height="28" rx="6" fill="#2f3b57"/><text x="508" y="359" fill="#ffd479">step/end · turn/end</text><text x="700" y="359" fill="#8a97b8" text-anchor="end">seq …</text>
    </g>

    <line x1="480" y1="382" x2="480" y2="400" stroke="#8a97b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="645" y="414" text-anchor="middle" font-size="12" fill="#a5e3a5">模型历史 = deriveMessages(日志) —— 随时可重算</text>
    <text x="645" y="436" text-anchor="middle" font-size="12" fill="#8a97b8">回放 / fork / 恢复 / 标题 / 遥测全部派生自它</text>
    <rect x="496" y="450" width="298" height="48" rx="9" fill="#1f8a4c"/>
    <text x="645" y="470" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">⚖️ 「模型可见 ⟺ 已记录」运行时不变量</text>
    <text x="645" y="489" text-anchor="middle" font-size="11" fill="#cdeeda">新增模型可见输入 ⇒ 必须新增会话事件</text>
  </g>

  <line x1="342" y1="90" x2="468" y2="150" stroke="#7a8296" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#tArr)"/>
  <text x="398" y="112" text-anchor="middle" font-size="11" fill="#7a8296">每一步都落日志</text>
</svg>
